name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pls, POSTGRES_PASSWORD: pls, POSTGRES_DB: plstest }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pls" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    env:
      DATABASE_URL: postgresql://pls:pls@localhost:5432/plstest
      SUPABASE_URL: https://test.supabase.co
      SUPABASE_JWT_SECRET: test-secret-test-secret-test-secret-32
      RUN_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest -q
