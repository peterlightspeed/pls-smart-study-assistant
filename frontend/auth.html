<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign in · PLS Smart Study Assistant</title>
  <meta name="theme-color" content="#4F6BED">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("pls-theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body class="auth-body">
  <main class="auth-wrap">
    <div class="auth-brand"><img src="/assets/icons/icon-192.png" alt="" width="40" height="40"><span>PLS Study</span></div>
    <div id="auth-root" class="pls-card auth-card" aria-live="polite"></div>
    <p class="text-caption text-center mt-4 mb-0">Plan goals, schedule study time and track your progress.</p>
  </main>
  <script type="module" src="/js/auth/auth.js"></script>
</body>
</html>
