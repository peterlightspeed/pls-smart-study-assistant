<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PLS Smart Study Assistant</title>
  <meta name="description" content="Plan goals, schedule study time, keep notes and track your progress.">
  <meta name="theme-color" content="#4F6BED">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="PLS Study">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- Apply saved theme before first paint (avoids a light flash in dark mode) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("pls-theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Primary">
      <div class="brand"><img src="/assets/icons/icon-192.png" alt="" width="32" height="32"><span>PLS Study</span></div>
      <nav id="sidebar-nav" class="d-flex flex-column gap-1"></nav>
    </aside>
    <div class="app-main">
      <main id="main" class="app-content" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <nav id="bottom-nav" class="bottom-nav" aria-label="Primary"></nav>
  <noscript><p class="p-4">PLS Smart Study Assistant needs JavaScript to run.</p></noscript>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
